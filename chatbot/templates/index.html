<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Career Guidance Chatbot 🧭</title>

<style>
  :root {
    --navy: #10243e;
    --navy-mid: #1b3a5c;
    --gold: #d8a13a;
    --sky: #eef3f8;
    --card: #ffffff;
    --ink: #1c2b3a;
    --muted: #6b7d90;
    --bubble-bot: #f4f7fa;
    --bubble-user: #10243e;
    --shadow: 0 10px 24px rgba(16, 36, 62, 0.18);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(160deg, var(--sky) 0%, #dbe6f2 100%);
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 90vh;
    max-height: 760px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header styled like a roadmap signpost */
  .header {
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: #fff;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    border-bottom: 3px solid var(--gold);
  }

  .compass-icon {
    width: 42px;
    height: 42px;
    background: var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
  }

  .header-text h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  .header-text p {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }

  /* Chat area styled like a dotted roadmap path */
  .chat-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle, rgba(216, 161, 58, 0.16) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    background-color: var(--sky);
  }

  .chat-area {
    height: 100%;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar {
    width: 6px;
  }
  .chat-area::-webkit-scrollbar-thumb {
    background: var(--navy-mid);
    border-radius: 10px;
  }

  .msg {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    box-shadow: 0 2px 8px rgba(16, 36, 62, 0.08);
    animation: pop-in 0.2s ease-out;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  @keyframes pop-in {
    from { transform: translateY(6px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--ink);
    border-bottom-left-radius: 4px;
    border-left: 3px solid var(--gold);
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-left: 3px solid var(--gold);
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--navy-mid);
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Scroll-to-latest button styled like a signpost marker */
  .scroll-btn {
    position: absolute;
    right: 16px;
    bottom: 16px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: none;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }

  .scroll-btn.show {
    display: flex;
  }

  .scroll-btn:hover {
    transform: scale(1.08);
  }

  /* Input area */
  .input-area {
    display: flex;
    gap: 8px;
    padding: 14px;
    background: var(--card);
    border-top: 1px solid #e2e8f0;
  }

  .input-area input {
    flex: 1;
    border: 1px solid #d7dfe8;
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 14px;
    outline: none;
    background: var(--sky);
    color: var(--ink);
  }

  .input-area button {
    background: var(--navy);
    border: none;
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .input-area button:hover {
    background: var(--navy-mid);
  }

  .input-area button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="compass-icon">🧭</div>
    <div class="header-text">
      <h1>Career Guidance Chatbot</h1>
      <p>Mapping out your professional path</p>
    </div>
  </div>

  <div class="chat-wrapper">
    <div class="chat-area" id="chatArea">
      <div class="msg bot">
        Hello! 🧭 I'm your Career Guidance Chatbot. Ask me about choosing a
        career path, building skills, or planning your next professional
        step!
      </div>
    </div>
    <button class="scroll-btn" id="scrollBtn" title="Jump to latest message">↓</button>
  </div>

  <div class="input-area">
    <input
      type="text"
      id="userInput"
      placeholder="Ask about your career path..."
      autocomplete="off"
    />
    <button id="sendBtn" title="Send">➤</button>
  </div>
</div>

<script>
  const chatArea = document.getElementById("chatArea");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const scrollBtn = document.getElementById("scrollBtn");

  const NEAR_BOTTOM_THRESHOLD = 60; // px

  function isNearBottom() {
    return (
      chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight <
      NEAR_BOTTOM_THRESHOLD
    );
  }

  function scrollToBottom(smooth = true) {
    chatArea.scrollTo({
      top: chatArea.scrollHeight,
      behavior: smooth ? "smooth" : "auto",
    });
  }

  function updateScrollButton() {
    if (isNearBottom()) {
      scrollBtn.classList.remove("show");
    } else {
      scrollBtn.classList.add("show");
    }
  }

  chatArea.addEventListener("scroll", updateScrollButton);

  scrollBtn.addEventListener("click", () => {
    scrollToBottom(true);
  });

  function appendMessage(text, sender) {
    const msg = document.createElement("div");
    msg.classList.add("msg", sender);
    msg.textContent = text;
    chatArea.appendChild(msg);

    // Auto-scroll only if user was already near the bottom,
    // otherwise just show the scroll-down button.
    if (isNearBottom() || sender === "user") {
      scrollToBottom(true);
    } else {
      updateScrollButton();
    }
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.classList.add("msg", "typing");
    typing.id = "typingIndicator";
    typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    chatArea.appendChild(typing);
    if (isNearBottom()) scrollToBottom(true);
  }

  function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await response.json();
      removeTyping();
      appendMessage(data.reply, "bot");
    } catch (error) {
      removeTyping();
      appendMessage("Network error. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  updateScrollButton();
</script>

</body>
</html>
